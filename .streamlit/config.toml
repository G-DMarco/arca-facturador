[server]
address = "127.0.0.1"
port = 8501
headless = true
maxUploadSize = 5
maxMessageSize = 8
enableCORS = true
enableXsrfProtection = true
enableStaticServing = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#176b52"
backgroundColor = "#f6f8fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#152536"
font = "sans serif"

[client]
showErrorDetails = false
