# Use alongside compose.yaml for one private professional installation.
services:
  facturador:
    environment:
      STREAMLIT_BROWSER_SERVER_ADDRESS: ${ARCA_DOMAIN:?Set ARCA_DOMAIN}
  gateway:
    image: caddy:2@sha256:0c994536bddb66445885237f1a5dcc1916bccea922661c76b4e9fc24061f9b52
    ports:
      - "80:80"
      - "443:443"
    environment:
      ARCA_DOMAIN: ${ARCA_DOMAIN:?Set ARCA_DOMAIN}
      ARCA_LOGIN: ${ARCA_LOGIN:?Set ARCA_LOGIN}
      ARCA_PASSWORD_HASH: ${ARCA_PASSWORD_HASH:?Set ARCA_PASSWORD_HASH}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      facturador:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  caddy_data:
  caddy_config:
