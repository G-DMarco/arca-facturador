# SPDX-License-Identifier: Apache-2.0
services:
  facturador:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - arca_data:/data
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  arca_data:
